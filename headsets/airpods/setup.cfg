[metadata]
name = airpodsd
url = https://github.com/jxmao-cn/linux-audio-toolkit/tree/main/headsets/airpods
version = attr: airpods.__version__
description = A userspace AirPods driver for Linux: pairing, auto-connect, battery and audio profiles
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = airpodsd contributors
keywords = airpods, bluetooth, bluez, linux, pulseaudio, pipewire
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: End Users/Desktop
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Multimedia :: Sound/Audio
    Topic :: System :: Hardware

[options]
python_requires = >=3.9
packages = find:
package_dir =
    = src
include_package_data = True
zip_safe = False

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    airpodsctl = airpods.cli:main
    airpodsd = airpods.cli:daemon_main

[options.extras_require]
dev =
    pytest>=7
    ruff>=0.4
