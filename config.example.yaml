# =============================================================================
# voice-input 配置文件
# -----------------------------------------------------------------------------
# 本地离线语音输入工具：按住 右 Shift / F9 说话、松开即上屏；
# 按一下 右 Ctrl 进入连续听写（再按一下结束）。
# 所有相对路径均相对于本配置文件所在目录（即项目根目录）解析。
# =============================================================================

# -----------------------------------------------------------------------------
# 音频采集（USB 耳机麦克风 -> 16 kHz 单声道）
# -----------------------------------------------------------------------------
audio:
  # 只是"优先偏好的" PulseAudio 输入源名称子串（大小写不敏感）。
  # 它仅用于"优先挑选"：当换到别的电脑、或拔掉这把 USB 耳机后，
  # 无需改任何代码——AudioCapture 会自动回退到系统当前默认麦克风，
  # 并自动适配任意 USB 麦 / 蓝牙耳机 / 笔记本内置麦，
  # 自动适配 44.1kHz / 48kHz / 16kHz 采样率与单声道 / 双声道输入。
  # 也就是说，本项填错或设备不存在都不会导致失败，只会走默认设备。
  # 留空则自动使用系统默认麦克风；也可填入如 "HECATE_GM400"、"USB" 等设备名子串优先匹配。
  preferred_device_substring: ""
  # 送给 ASR 的目标采样率（SenseVoice 要求 16000）。
  target_sample_rate: 16000
  # 预卷时长（毫秒）：记录按下热键"之前"的一小段音频，避免吞掉首字。
  pre_roll_ms: 250
  # Silero VAD (ONNX) 模型路径；文件不存在时自动退化为 RMS 能量端点检测。
  vad_model_path: "models/silero_vad.onnx"
  # VAD 语音概率阈值：越高越保守（越不容易把噪声判成语音）。
  vad_threshold: 0.45
  # 连续模式下，判定"一句话结束"所需的静音时长（秒）。
  min_silence_duration: 0.6

# -----------------------------------------------------------------------------
# 全局热键（双键独立双模）
# -----------------------------------------------------------------------------
hotkey:
  # 连续听写模式开关（按一下开始连续听写，再按一下结束）
  toggle_key: "ctrl_r"
  # 按住说话模式按键（按住说话，松开立即上屏；支持逗号分隔多个键，如右Shift和F9）
  ptt_key: "shift_r,f9"
  # 按住说话触发阈值（秒）：按住满 0.20s 才触发，避免短按右Shift切输入法或组合键打大写字母时误触
  hold_threshold_sec: 0.20

# -----------------------------------------------------------------------------
# 语音识别（sherpa-onnx + SenseVoice，中英日韩粤）
# -----------------------------------------------------------------------------
asr:
  # SenseVoice 模型目录，需包含 model.int8.onnx / model.onnx 与 tokens.txt。
  model_dir: "models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17"
  # CPU 推理线程数。
  num_threads: 4
  # 是否开启逆文本规范化（数字、标点等自动恢复）。
  use_itn: true
  # 语言提示："auto" 自动识别中/英/粤/日/韩。
  language: "auto"
  # 推理后端："cpu" 或 "cuda"。
  provider: "cpu"

# -----------------------------------------------------------------------------
# 识别结果后处理
# -----------------------------------------------------------------------------
post_processor:
  # 去除句首 / 句中孤立的无意义语气词（嗯、呃、啊……）。
  clean_fillers: true
  # 在汉字与 ASCII 字母 / 数字交界处自动补一个空格（中英混排更美观）。
  auto_space_cjk_ascii: true
  # 自定义口述词替换（长词优先匹配）。
  custom_replacements:
    "新的一行": "\n"
    "回车换行": "\n"
  # ===========================================================================
  # Level 1（规则清洗，零延迟）之后，可选接入本机 LLM 做极速同音字 / 语法纠错。
  # 默认指向本机 vLLM（Docker 容器 qwen38-vllm）部署的 Qwen3.8-27B。
  # 无感降级：若 127.0.0.1:8000 未启动（ConnectionRefused，<2ms）或超时
  # （timeout: 1.5 秒），会自动回退到 Level 1 的规则清洗结果，绝不阻塞上屏。
  # ===========================================================================
  enable_llm: false
  api_base: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  model: "qwen3.8-27b"
  timeout: 1.5
  # qwen3.8-27b 默认开启思考模式（reasoning）；置 true 会在请求 payload 顶层
  # 注入 chat_template_kwargs.enable_thinking=false，让模型不做长篇思考、
  # 在零点几秒内直接输出纠错后的文本。
  disable_thinking: true
  # Level 2 后端选择："openai" 走上面的 Chat Completions 接口；
  # "opencode_cli" 走本机 `opencode run` CLI（D 档，见下）。
  llm_backend: "openai"
  # D 档 OpenCode 免费纠错：opencode_cli 复用本机 OpenCode 登录态、免费、无需 Key，单次约 2~3 秒。
  opencode_model: "opencode/deepseek-v4.1-flash-free"
  opencode_timeout: 30.0

# -----------------------------------------------------------------------------
# 文本注入（剪贴板事务：备份 -> 写入 -> 粘贴 -> 延迟恢复）
# -----------------------------------------------------------------------------
injector:
  # 注入完成后是否恢复用户原有的剪贴板内容。
  restore_clipboard: true
  # 恢复剪贴板前的等待时间（秒）：需等目标窗口读取完剪贴板。
  restore_delay_sec: 0.35

# -----------------------------------------------------------------------------
# 交互反馈
# -----------------------------------------------------------------------------
feedback:
  # 是否播放开始 / 结束提示音。
  enable_sound: true
  start_wav: "assets/start.wav"
  stop_wav: "assets/stop.wav"
  # 是否额外发送桌面通知（notify-send）。默认关闭，
  # 用声音提示即可，避免桌面弹窗抢走输入焦点。
  enable_notification: false

# -----------------------------------------------------------------------------
# 三档纠错模式预置（由控制面板切换时整组复制进上面的 post_processor 段）
# -----------------------------------------------------------------------------
# 上面 post_processor 段永远是"当前生效档"的平铺值；本段只保存各档的模板。
# A 档 = 关闭 LLM（post_processor.enable_llm=false，其余键保持不动）；
# B 档 = 复制 local_qwen 的全部键；C 档 = 复制 deepseek 的全部键；
# D 档 = 复制 opencode 的全部键（含 llm_backend: "opencode_cli"）。
llm_modes:
  local_qwen:
    api_base: "http://127.0.0.1:8000/v1"
    api_key: "EMPTY"
    model: "qwen3.8-27b"
    timeout: 1.5
    disable_thinking: true
  deepseek:
    api_base: "https://api.deepseek.com/v1"
    api_key: ""          # 由面板填写，勿提交真实 key
    model: "deepseek-chat"
    timeout: 8.0
    disable_thinking: false
  opencode:
    llm_backend: "opencode_cli"
    opencode_model: "opencode/deepseek-v4.1-flash-free"
    opencode_timeout: 30.0

# -----------------------------------------------------------------------------
# 图形化管理面板（voice_input/control_center.py + dashboard.html）
# -----------------------------------------------------------------------------
control_center:
  # 面板监听端口（127.0.0.1，仅本机可访问）。
  port: 17880
  # 本地千问容器 compose 文件：支持 ~ 与相对本配置文件的相对路径；
  # 文件不存在时面板会显示"未部署本地模型"。
  qwen_compose_file: "~/qwen38/docker-compose.yml"
  # 可选：访问云端 API 时显式使用的代理（留空则沿用环境变量 http_proxy/https_proxy）。
  proxy: ""
