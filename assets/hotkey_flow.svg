<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="hkShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="hkArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="hkArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="hkArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="300" rx="14" fill="#f8fafc"/>
  <rect x="0" y="0" width="960" height="300" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Dual-Key Independent State Machine &amp; Anti-Misfire Guard</text>
  <text x="480" y="44" text-anchor="middle" font-size="11" fill="#64748b">Two keys run isolated state machines — combo presses and short taps never trigger recording</text>

  <!-- ===== LEFT PANEL : PTT ===== -->
  <g filter="url(#hkShadow)">
    <rect x="16" y="56" width="456" height="228" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="16" y="56" width="456" height="40" rx="12" fill="#f59e0b"/>
    <rect x="16" y="80" width="456" height="16" fill="#f59e0b"/>
    <text x="244" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Push-to-Talk — Hold Right Shift / F9</text>
    <text x="244" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#fef3c7">LEFT STATE MACHINE · hold-to-talk, release-to-inject</text>
  </g>

  <!-- left flow nodes -->
  <g text-anchor="middle" font-size="10.5">
    <!-- Key Press -->
    <rect x="36" y="108" width="130" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="101" y="122" font-weight="700" fill="#92400e">Key Press</text>
    <text x="101" y="135" fill="#92400e" font-size="9.5">R-Shift / F9 down</text>
    <!-- Decision hexagon (symmetric, spacious) -->
    <polygon points="180,126 200,102 292,102 312,126 292,150 200,150" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="246" y="121" font-size="9.5" font-weight="700" fill="#92400e">Hold ≥ 200ms</text>
    <text x="246" y="133" font-size="9.5" fill="#92400e">+ no other key?</text>
    <!-- Yes branch -->
    <rect x="316" y="104" width="138" height="42" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
    <text x="385" y="119" font-weight="700" fill="#065f46">Yes → Recording</text>
    <text x="385" y="133" font-size="9.5" fill="#047857">Start PTT capture</text>
    <!-- Release -->
    <rect x="316" y="158" width="138" height="46" rx="8" fill="#10b981"/>
    <text x="385" y="174" font-weight="700" fill="#ffffff">Key Release →</text>
    <text x="385" y="188" font-size="9.5" fill="#d1fae5">Transcribe &amp; Inject now</text>
    <!-- No branch -->
    <rect x="176" y="158" width="120" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="236" y="174" font-weight="700" fill="#991b1b">No → Bypassed</text>
    <text x="236" y="188" font-size="9.5" fill="#b91c1c">&lt;200ms / Shift+A</text>
    <rect x="36" y="158" width="130" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="101" y="174" font-weight="600" fill="#475569">Normal typing /</text>
    <text x="101" y="188" font-size="9.5" fill="#475569">IME switch kept</text>
    <!-- bypass detail -->
    <rect x="36" y="214" width="418" height="52" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="245" y="231" font-size="10.5" fill="#92400e">Combo-Key Guard: any concurrent key (e.g. <tspan font-weight="700">Shift+A</tspan>) aborts PTT · Auto-Repeat filtered</text>
    <text x="245" y="247" font-size="10.5" fill="#92400e">Short tap releases silently — zero UI flicker, zero stray text</text>
    <!-- arrows left -->
    <line x1="166" y1="126" x2="178" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#hkArrow)"/>
    <line x1="312" y1="126" x2="314" y2="126" stroke="#059669" stroke-width="1.6" marker-end="url(#hkArrowGreen)"/>
    <line x1="246" y1="150" x2="246" y2="156" stroke="#dc2626" stroke-width="1.6" marker-end="url(#hkArrowRed)"/>
    <text x="258" y="153" font-size="9" font-weight="700" fill="#dc2626">No</text>
    <text x="307" y="119" font-size="9" font-weight="700" fill="#059669">Yes</text>
    <line x1="385" y1="146" x2="385" y2="156" stroke="#059669" stroke-width="1.6" marker-end="url(#hkArrowGreen)"/>
    <line x1="176" y1="181" x2="168" y2="181" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#hkArrow)"/>
  </g>

  <!-- ===== RIGHT PANEL : TOGGLE ===== -->
  <g filter="url(#hkShadow)">
    <rect x="488" y="56" width="456" height="228" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="488" y="56" width="456" height="40" rx="12" fill="#10b981"/>
    <rect x="488" y="80" width="456" height="16" fill="#10b981"/>
    <text x="716" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Continuous Dictation — Tap Right Ctrl</text>
    <text x="716" y="90" text-anchor="middle" font-size="10" font-weight="600" fill="#d1fae5">RIGHT STATE MACHINE · tap-to-start, tap-to-stop</text>
  </g>

  <g text-anchor="middle" font-size="10.5">
    <rect x="508" y="108" width="132" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
    <text x="574" y="123" font-weight="700" fill="#065f46">Single Tap</text>
    <text x="574" y="137" font-size="9.5" fill="#047857">no combo key</text>

    <rect x="656" y="108" width="132" height="40" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.3"/>
    <text x="722" y="123" font-weight="700" fill="#065f46">Toggle ON</text>
    <text x="722" y="137" font-size="9.5" fill="#047857">start recording</text>

    <rect x="804" y="108" width="120" height="40" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.3"/>
    <text x="864" y="123" font-weight="700" fill="#065f46">VAD Segment</text>
    <text x="864" y="137" font-size="9.5" fill="#047857">live inject loop</text>

    <rect x="508" y="160" width="280" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text x="648" y="176" font-weight="600" fill="#065f46">Silero VAD Auto-Segment &amp; Live Inject</text>
    <text x="648" y="191" font-size="9.5" fill="#047857">pause = boundary · text streams into cursor while talking</text>

    <rect x="804" y="160" width="120" height="44" rx="8" fill="#059669"/>
    <text x="864" y="176" font-weight="700" fill="#ffffff">Tap Again →</text>
    <text x="864" y="191" font-size="9.5" fill="#d1fae5">Flush &amp; Stop</text>

    <rect x="508" y="214" width="416" height="52" rx="8" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
    <text x="716" y="231" font-size="10.5" fill="#065f46">Ctrl-combo (e.g. <tspan font-weight="700">Ctrl+C</tspan>) never toggles · residual audio flushed on stop</text>
    <text x="716" y="247" font-size="10.5" fill="#065f46">Independent from PTT — both keys can interleave safely</text>

    <line x1="640" y1="128" x2="654" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#hkArrow)"/>
    <line x1="788" y1="128" x2="802" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#hkArrow)"/>
    <line x1="722" y1="148" x2="722" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#hkArrow)"/>
    <line x1="788" y1="182" x2="802" y2="182" stroke="#059669" stroke-width="1.6" marker-end="url(#hkArrowGreen)"/>
  </g>
</svg>
