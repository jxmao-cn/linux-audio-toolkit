name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  voice-input:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: voice-input
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install headless test dependencies
        run: python -m pip install numpy scipy pyyaml requests pynput python-xlib
      - name: Check syntax
        run: |
          python -m compileall -q main.py voice_input tests tools
          bash -n run.sh setup.sh
      - name: Run headless regression tests
        run: |
          python -m unittest discover -s tests -v
          python tests/test_utterance_accumulator.py
      - name: Check packaging metadata
        run: |
          python -m pip install --no-deps .
          cd /tmp
          python -c "import main, importlib.resources; assert importlib.resources.files('voice_input').joinpath('dashboard.html').is_file()"

  gm400:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Shell syntax
        run: find headsets/gm400 -name '*.sh' -exec sh -n '{}' \;
      - name: Simulated recovery and installation tests
        run: headsets/gm400/tests/run.sh
