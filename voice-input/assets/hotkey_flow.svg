<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="hkShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="hkArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="hkArrowGreen" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#059669"/>
    </marker>
    <marker id="hkArrowRed" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="370" rx="14" fill="#f8fafc"/>
  <rect x="0" y="0" width="1120" height="370" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="560" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Dual-Key Independent State Machine and Anti-Misfire Guard</text>
  <text x="560" y="44" text-anchor="middle" font-size="11" fill="#64748b">Two keys run isolated state machines -- combo presses and short taps never trigger recording</text>

  <!-- ===== LEFT PANEL : x24 y68 w520 h278 ===== -->
  <g filter="url(#hkShadow)">
    <rect x="24" y="68" width="520" height="278" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="24" y="68" width="520" height="42" rx="12" fill="#f59e0b"/>
    <rect x="24" y="94" width="520" height="16" fill="#f59e0b"/>
    <text x="284" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Push-to-Talk -- Hold Right Shift / F9</text>
    <text x="284" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#fef3c7">LEFT STATE MACHINE | hold-to-talk, release-to-inject</text>
  </g>

  <g text-anchor="middle">
    <!-- Row 1 -->
    <rect x="42" y="122" width="124" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="104" y="144" font-size="10.5" font-weight="700" fill="#92400e">1. Key Press</text>
    <text x="104" y="160" font-size="9.5" fill="#92400e">R-Shift or F9 down</text>

    <polygon points="210,148 230,122 340,122 360,148 340,174 230,174" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="285" y="144" font-size="10" font-weight="700" fill="#92400e">2. Hold &gt;= 200ms?</text>
    <text x="285" y="160" font-size="9.5" fill="#92400e">and no other key</text>

    <rect x="408" y="122" width="118" height="52" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
    <text x="467" y="144" font-size="10.5" font-weight="700" fill="#065f46">3. Recording</text>
    <text x="467" y="160" font-size="9.5" fill="#047857">Start PTT capture</text>

    <!-- Row 2 -->
    <rect x="408" y="218" width="118" height="52" rx="8" fill="#10b981"/>
    <text x="467" y="240" font-size="10.5" font-weight="700" fill="#ffffff">4. Key Release</text>
    <text x="467" y="256" font-size="9.5" fill="#d1fae5">Transcribe and Inject</text>

    <rect x="210" y="218" width="150" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="285" y="240" font-size="10.5" font-weight="700" fill="#991b1b">Bypassed</text>
    <text x="285" y="256" font-size="9.5" fill="#b91c1c">&lt; 200ms or Shift+A</text>

    <rect x="42" y="218" width="124" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="104" y="240" font-size="10.5" font-weight="600" fill="#475569">Normal Typing</text>
    <text x="104" y="256" font-size="9.5" fill="#475569">IME switch kept</text>

    <!-- bottom note bar -->
    <rect x="42" y="284" width="484" height="46" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="284" y="303" font-size="10.5" fill="#92400e">Combo-Key Guard: any concurrent key (e.g. <tspan font-weight="700">Shift+A</tspan>) aborts PTT | Auto-Repeat filtered</text>
    <text x="284" y="319" font-size="10.5" fill="#92400e">Short tap releases silently -- zero UI flicker, zero stray text</text>
  </g>

  <!-- left arrows (38-44px shafts, 2-4px breathing gaps) -->
  <line x1="168" y1="148" x2="206" y2="148" stroke="#64748b" stroke-width="1.8" marker-end="url(#hkArrow)"/>
  <line x1="362" y1="148" x2="404" y2="148" stroke="#059669" stroke-width="1.8" marker-end="url(#hkArrowGreen)"/>
  <line x1="285" y1="176" x2="285" y2="214" stroke="#dc2626" stroke-width="1.8" marker-end="url(#hkArrowRed)"/>
  <line x1="467" y1="176" x2="467" y2="214" stroke="#059669" stroke-width="1.8" marker-end="url(#hkArrowGreen)"/>
  <line x1="208" y1="244" x2="170" y2="244" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#hkArrow)"/>

  <!-- pill badges for Yes / No (offset >=10px from tips) -->
  <g text-anchor="middle" font-size="9" font-weight="700">
    <rect x="361" y="122" width="44" height="18" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="383" y="135" fill="#065f46">Yes</text>
    <rect x="294" y="190" width="40" height="18" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="314" y="203" fill="#991b1b">No</text>
  </g>

  <!-- ===== RIGHT PANEL : x576 y68 w520 h278, 2x2 clockwise loop ===== -->
  <g filter="url(#hkShadow)">
    <rect x="576" y="68" width="520" height="278" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="576" y="68" width="520" height="42" rx="12" fill="#10b981"/>
    <rect x="576" y="94" width="520" height="16" fill="#10b981"/>
    <text x="836" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Continuous Dictation -- Tap Right Ctrl</text>
    <text x="836" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#d1fae5">RIGHT STATE MACHINE | tap-to-start, tap-to-stop</text>
  </g>

  <g text-anchor="middle">
    <rect x="596" y="122" width="204" height="52" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
    <text x="698" y="144" font-size="10.5" font-weight="700" fill="#065f46">1. Single Tap R-Ctrl</text>
    <text x="698" y="160" font-size="9.5" fill="#047857">No combo key pressed</text>

    <rect x="872" y="122" width="204" height="52" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.3"/>
    <text x="974" y="144" font-size="10.5" font-weight="700" fill="#065f46">2. Toggle Mode ON</text>
    <text x="974" y="160" font-size="9.5" fill="#047857">Pre-roll fed to Silero VAD</text>

    <rect x="872" y="218" width="204" height="52" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.3"/>
    <text x="974" y="240" font-size="10.5" font-weight="700" fill="#065f46">3. VAD Auto-Segment</text>
    <text x="974" y="256" font-size="9.5" fill="#047857">0.6s pause -&gt; live inject</text>

    <rect x="596" y="218" width="204" height="52" rx="8" fill="#059669"/>
    <text x="698" y="240" font-size="10.5" font-weight="700" fill="#ffffff">4. Flush and Stop</text>
    <text x="698" y="256" font-size="9.5" fill="#d1fae5">Flush tail audio -&gt; IDLE</text>

    <rect x="596" y="284" width="480" height="46" rx="8" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1"/>
    <text x="836" y="303" font-size="10.5" fill="#065f46">Ctrl-combo (e.g. <tspan font-weight="700">Ctrl+C</tspan>) never toggles | residual audio flushed on stop</text>
    <text x="836" y="319" font-size="10.5" fill="#065f46">Independent from PTT -- both keys can interleave safely</text>
  </g>

  <!-- right arrows: 66px horizontal shafts, 38px vertical shaft -->
  <line x1="802" y1="148" x2="868" y2="148" stroke="#64748b" stroke-width="1.8" marker-end="url(#hkArrow)"/>
  <line x1="974" y1="176" x2="974" y2="214" stroke="#64748b" stroke-width="1.8" marker-end="url(#hkArrow)"/>
  <line x1="870" y1="244" x2="804" y2="244" stroke="#059669" stroke-width="1.8" marker-end="url(#hkArrowGreen)"/>

  <!-- pill badges for right panel labels -->
  <g text-anchor="middle" font-size="9" font-weight="700">
    <rect x="808" y="122" width="54" height="18" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="835" y="135" fill="#334155">Activate</text>
    <rect x="803" y="218" width="68" height="18" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
    <text x="837" y="231" fill="#065f46">Tap R-Ctrl</text>
  </g>
</svg>
