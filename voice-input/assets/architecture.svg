<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowMain" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowUp" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="500" rx="16" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="500" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="600" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">linux-voice-input -- End-to-End Pipeline and Control Plane</text>
  <text x="600" y="50" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">Five-stage offline-first voice typing pipeline | local ASR | guarded post-processing | lossless injection</text>

  <!-- ============ STAGE 1 : x 32..228 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="78" width="196" height="276" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="32" y="78" width="196" height="64" rx="12" fill="#3b82f6"/>
    <rect x="32" y="118" width="196" height="24" fill="#3b82f6"/>
    <text x="130" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#dbeafe">STAGE 1</text>
    <text x="130" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Audio Capture and VAD</text>
    <text x="130" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff" font-style="italic">AudioCapture</text>
  </g>
  <g font-size="10.8" fill="#334155" text-anchor="middle">
    <text x="130" y="164"><tspan font-weight="600" fill="#1e293b">PulseAudio / PipeWire</tspan></text>
    <text x="130" y="181">/ PortAudio input</text>
    <line x1="57" y1="192" x2="203" y2="192" stroke="#e2e8f0" stroke-width="1"/>
    <text x="130" y="210"><tspan font-weight="600" fill="#1e293b">Auto Fallback</tspan> and Hotplug</text>
    <line x1="57" y1="221" x2="203" y2="221" stroke="#e2e8f0" stroke-width="1"/>
    <text x="130" y="239">48kHz Stereo -&gt; 16kHz</text>
    <text x="130" y="255">Mono Resample</text>
    <line x1="57" y1="266" x2="203" y2="266" stroke="#e2e8f0" stroke-width="1"/>
    <text x="130" y="284">250ms Pre-roll RingBuffer</text>
    <text x="130" y="300">+ <tspan font-weight="600" fill="#1e293b">Silero VAD</tspan> gate</text>
    <rect x="54" y="310" width="152" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="130" y="323" font-size="10.5" font-weight="700" fill="#2563eb">Speech only -&gt; downstream</text>
    <text x="130" y="336" font-size="10" fill="#2563eb">filtered stages</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="232" y1="216" x2="256" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arrowMain)"/>

  <!-- ============ STAGE 2 : x 260..456 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="260" y="78" width="196" height="276" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="260" y="78" width="196" height="64" rx="12" fill="#f59e0b"/>
    <rect x="260" y="118" width="196" height="24" fill="#f59e0b"/>
    <text x="358" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#fef3c7">STAGE 2</text>
    <text x="358" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Dual-Key Hotkeys</text>
    <text x="358" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff" font-style="italic">HotkeyDaemon</text>
  </g>
  <g font-size="10.8" fill="#334155" text-anchor="middle">
    <text x="358" y="164"><tspan font-weight="700" fill="#b45309">PTT:</tspan> Hold R-Shift / F9</text>
    <text x="358" y="181">&gt;= 0.2s to trigger</text>
    <line x1="285" y1="192" x2="431" y2="192" stroke="#e2e8f0" stroke-width="1"/>
    <text x="358" y="210"><tspan font-weight="700" fill="#b45309">Toggle:</tspan> Tap Right Ctrl</text>
    <text x="358" y="227">continuous dictation</text>
    <line x1="285" y1="238" x2="431" y2="238" stroke="#e2e8f0" stroke-width="1"/>
    <text x="358" y="256">Combo-Key Guard</text>
    <text x="358" y="272">and Auto-Repeat Filter</text>
    <rect x="282" y="282" width="152" height="60" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="358" y="299" font-size="10.5" font-weight="700" fill="#b45309">Independent</text>
    <text x="358" y="314" font-size="10.5" fill="#92400e">state machines</text>
    <text x="358" y="329" font-size="10.5" fill="#92400e">+ anti-misfire logic</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="460" y1="216" x2="484" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arrowMain)"/>

  <!-- ============ STAGE 3 : x 488..684 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="488" y="78" width="196" height="276" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="488" y="78" width="196" height="64" rx="12" fill="#10b981"/>
    <rect x="488" y="118" width="196" height="24" fill="#10b981"/>
    <text x="586" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#d1fae5">STAGE 3</text>
    <text x="586" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Local Offline ASR</text>
    <text x="586" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff" font-style="italic">ASREngine</text>
  </g>
  <g font-size="10.8" fill="#334155" text-anchor="middle">
    <text x="586" y="164">sherpa-onnx +</text>
    <text x="586" y="181"><tspan font-weight="600" fill="#1e293b">SenseVoice-Small</tspan> INT8</text>
    <line x1="513" y1="192" x2="659" y2="192" stroke="#e2e8f0" stroke-width="1"/>
    <text x="586" y="210">ZH / EN / JA / KO / YUE</text>
    <text x="586" y="227">Code-Switching ready</text>
    <line x1="513" y1="238" x2="659" y2="238" stroke="#e2e8f0" stroke-width="1"/>
    <text x="586" y="256">~100ms CPU inference</text>
    <text x="586" y="272">Zero GPU VRAM</text>
    <rect x="510" y="282" width="152" height="60" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="586" y="299" font-size="10.5" font-weight="700" fill="#047857">100% offline,</text>
    <text x="586" y="314" font-size="10.5" fill="#047857">private by design</text>
    <text x="586" y="329" font-size="10.5" fill="#047857">no cloud upload</text>
  </g>

  <!-- Arrow 3->4 -->
  <line x1="688" y1="216" x2="712" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arrowMain)"/>

  <!-- ============ STAGE 4 : x 716..912 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="716" y="78" width="196" height="276" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="716" y="78" width="196" height="64" rx="12" fill="#8b5cf6"/>
    <rect x="716" y="118" width="196" height="24" fill="#8b5cf6"/>
    <text x="814" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ede9fe">STAGE 4</text>
    <text x="814" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4-Tier Post-Process</text>
    <text x="814" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff" font-style="italic">PostProcessor</text>
  </g>
  <g font-size="10.5" fill="#334155" text-anchor="middle">
    <text x="814" y="162"><tspan font-weight="700" fill="#6d28d9">A:</tspan> 0ms Rules (fillers,</text>
    <text x="814" y="177">CJK-ASCII spacing)</text>
    <text x="814" y="194"><tspan font-weight="700" fill="#6d28d9">B:</tspan> Local vLLM Qwen</text>
    <text x="814" y="209">~300ms, No-Thinking</text>
    <text x="814" y="226"><tspan font-weight="700" fill="#6d28d9">C:</tspan> Cloud API (DeepSeek)</text>
    <text x="814" y="241">OpenAI-compatible</text>
    <text x="814" y="258"><tspan font-weight="700" fill="#6d28d9">D:</tspan> OpenCode Free CLI</text>
    <rect x="738" y="268" width="152" height="74" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="814" y="285" font-size="10.5" font-weight="700" fill="#6d28d9">Hard Timeout +</text>
    <text x="814" y="300" font-size="10.5" fill="#5b21b6">Instant Fallback</text>
    <text x="814" y="315" font-size="10.5" fill="#5b21b6">Guard (A always</text>
    <text x="814" y="330" font-size="10.5" fill="#5b21b6">wins on timeout)</text>
  </g>

  <!-- Arrow 4->5 -->
  <line x1="916" y1="216" x2="940" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arrowMain)"/>

  <!-- ============ STAGE 5 : x 944..1140 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="944" y="78" width="196" height="276" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="944" y="78" width="196" height="64" rx="12" fill="#6366f1"/>
    <rect x="944" y="118" width="196" height="24" fill="#6366f1"/>
    <text x="1042" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#e0e7ff">STAGE 5</text>
    <text x="1042" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Lossless Injection</text>
    <text x="1042" y="136" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffffff" font-style="italic">TextInjector</text>
  </g>
  <g font-size="10.8" fill="#334155" text-anchor="middle">
    <text x="1042" y="164">X11: xclip + xdotool</text>
    <text x="1042" y="181">/ XTEST paste</text>
    <line x1="969" y1="192" x2="1115" y2="192" stroke="#e2e8f0" stroke-width="1"/>
    <text x="1042" y="210">Wayland: wl-copy</text>
    <text x="1042" y="227">+ wtype typing</text>
    <line x1="969" y1="238" x2="1115" y2="238" stroke="#e2e8f0" stroke-width="1"/>
    <text x="1042" y="256">GUI Ctrl+V vs Terminal</text>
    <text x="1042" y="272">Ctrl+Shift+V detect</text>
    <rect x="966" y="282" width="152" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="1042" y="299" font-size="10.5" font-weight="700" fill="#4338ca">Atomic clipboard</text>
    <text x="1042" y="314" font-size="10.5" fill="#4338ca">backup and delayed</text>
    <text x="1042" y="329" font-size="10.5" fill="#4338ca">restore - zero loss</text>
  </g>

  <!-- ============ MANAGEMENT PLANE : x32 y394 w1108 h64 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="394" width="1108" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="64" cy="426" r="14" fill="#3b82f6"/>
    <text x="64" y="431" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C</text>
    <text x="88" y="422" font-size="13.5" font-weight="700" fill="#ffffff">Web Control Center</text>
    <text x="88" y="441" font-size="11.5" font-weight="400" fill="#93c5fd">http://127.0.0.1:17880</text>
    <line x1="310" y1="404" x2="310" y2="452" stroke="#334155" stroke-width="1.5"/>
    <g font-size="11.5" fill="#cbd5e1">
      <text x="332" y="422"><tspan font-weight="700" fill="#ffffff">Mode Switching</tspan>  |  PTT / Toggle / Container profiles</text>
      <text x="332" y="442"><tspan font-weight="700" fill="#ffffff">Container Control</tspan>  |  vLLM start-stop  |  <tspan font-weight="700" fill="#ffffff">Live Logs</tspan> and Diagnostics</text>
    </g>
    <g font-size="10" font-weight="700" text-anchor="middle">
      <rect x="906" y="410" width="96" height="24" rx="12" fill="none" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="920" cy="422" r="4" fill="#10b981"/>
      <text x="950" y="426" fill="#6ee7b7">ONLINE</text>
      <rect x="1012" y="410" width="96" height="24" rx="12" fill="#3b82f6"/>
      <text x="1060" y="426" fill="#ffffff">Open UI &gt;</text>
    </g>
  </g>

  <!-- dashed control arrows: y1=392 y2=358 (34px shafts, pointing up) -->
  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85" fill="none">
    <line x1="130" y1="392" x2="130" y2="358" marker-end="url(#arrowUp)"/>
    <line x1="358" y1="392" x2="358" y2="358" marker-end="url(#arrowUp)"/>
    <line x1="586" y1="392" x2="586" y2="358" marker-end="url(#arrowUp)"/>
    <line x1="814" y1="392" x2="814" y2="358" marker-end="url(#arrowUp)"/>
    <line x1="1042" y1="392" x2="1042" y2="358" marker-end="url(#arrowUp)"/>
  </g>

  <text x="600" y="484" text-anchor="middle" font-size="10.5" fill="#94a3b8">Audio -&gt; Hotkeys -&gt; ASR -&gt; Post-Processing -&gt; Injection ..... managed by Web Control Center (management plane)</text>
</svg>
